<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="tabs">
        <button id="tab-signup" class="active" onclick="switchTab('signup')">
          Sign up
        </button>
        <button id="tab-login" onclick="switchTab('login')">Login</button>
      </div>

      <form id="signup-form" class="form-content active" novalidate>
        <h2>Create an account</h2>

        <div class="form-row">
          <div class="form-group">
            <label>First Name</label>
            <input type="text" id="firstName" name="firstName" />
            <span class="error-message"></span>
          </div>
          <div class="form-group">
            <label>Last Name</label>
            <input type="text" id="lastName" name="lastName" />
            <span class="error-message"></span>
          </div>
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" name="email" />
          <span class="error-message"></span>
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="input-wrapper">
            <input type="password" id="regPassword" name="password" />
            <button
              type="button"
              class="eye-btn"
              onclick="togglePassword('regPassword')"
            >
              👁️
            </button>
          </div>
          <span class="error-message"></span>
        </div>

        <div class="form-group">
          <label>Confirm Password</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
            />
            <button
              type="button"
              class="eye-btn"
              onclick="togglePassword('confirmPassword')"
            >
              👁️
            </button>
          </div>
          <span class="error-message"></span>
        </div>

        <div class="form-group">
          <label>Phone</label>
          <input type="text" id="phone" name="phone" placeholder="+380..." />
          <span class="error-message"></span>
        </div>

        <div class="form-group">
          <label>Date of Birth</label>
          <input type="date" id="dob" name="dob" />
          <span class="error-message"></span>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Sex</label>
            <select id="sex" name="sex">
              <option value="">Select...</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
              <option value="mechanic">Mechanic</option>
            </select>
            <span class="error-message"></span>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Country</label>
            <select id="country" name="country" onchange="updateCities()">
              <option value="">Select Country</option>
              <option value="ua">Ukraine</option>
              <option value="pl">Poland</option>
            </select>
            <span class="error-message"></span>
          </div>
          <div class="form-group">
            <label>City</label>
            <select id="city" name="city" disabled>
              <option value="">Select City</option>
            </select>
            <span class="error-message"></span>
          </div>
        </div>

        <button type="submit" class="submit-btn">Sign up</button>
        <div id="signup-success" class="success-message"></div>
      </form>

      <form id="login-form" class="form-content" novalidate>
        <h2>Login here</h2>

        <div class="form-group">
          <label>Username</label>
          <input type="text" id="loginUsername" name="username" />
          <span class="error-message"></span>
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="input-wrapper">
            <input type="password" id="loginPassword" name="password" />
            <button
              type="button"
              class="eye-btn"
              onclick="togglePassword('loginPassword')"
            >
              👁️
            </button>
          </div>
          <span class="error-message"></span>
        </div>

        <div class="form-group checkbox-group">
          <input type="checkbox" id="rememberMe" />
          <label for="rememberMe">Remember Me</label>
        </div>

        <button type="submit" class="submit-btn">Login</button>
        <div id="login-success" class="success-message"></div>
      </form>
    </div>

    <script src="script.js"></script>
  </body>
</html>
